{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>{{ group.name }} में Visit भेजें</h1>
  <p>नीचे button WhatsApp में message पहले से भरकर खोलेगा। अपना group चुनें और केवल Send दबाएँ—Copy/Paste नहीं करना है।</p>
  <textarea id="visit-message" rows="14" readonly>{{ message }}</textarea>
  <div class="actions" style="margin-top:14px">
    <a class="button green" href="{{ share_url }}">Open WhatsApp — No Copy/Paste</a>
    <a class="button secondary" href="{{ group.invite_url }}">Open Saved Group</a>
    <a class="button secondary" href="{{ url_for('dashboard') }}">Back to MIS</a>
  </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Forgot Password · SVAI{% endblock %}
{% block mainclass %}login-wrap{% endblock %}
{% block content %}
<section class="login-card">
  <div class="login-logo">SVAI</div>
  <h1>Forgot Password</h1>
  <p>Registered SVAI email enter karein. 6-digit reset code linked Gmail/Yahoo se isi email par aayega.</p>
  <form method="post" class="stack">
    <label>Registered Email
      <input type="email" name="email" required autofocus autocomplete="email">
    </label>
    <button class="green" type="submit">Send Reset Code</button>
  </form>
  <p class="login-help"><a href="{{ url_for('login') }}">Back to Login</a></p>
</section>
{% endblock %}

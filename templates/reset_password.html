{% extends "base.html" %}
{% block title %}Reset Password · SVAI{% endblock %}
{% block mainclass %}login-wrap{% endblock %}
{% block content %}
<section class="login-card">
  <div class="login-logo">SVAI</div>
  <h1>Reset Password</h1>
  <p>{{ reset_email }} ka email reset code ya administrator recovery code enter karein.</p>
  <form method="post" class="stack">
    <label>Reset / Recovery Code
      <input type="text" name="code" maxlength="64" required autofocus autocomplete="one-time-code">
    </label>
    <label>New Password
      <input type="password" name="new_password" minlength="8" required autocomplete="new-password">
    </label>
    <label>Confirm New Password
      <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
    </label>
    <button class="green" type="submit">Reset Password</button>
  </form>
  <p class="login-help"><a href="{{ url_for('forgot_password') }}">Send a new code</a></p>
</section>
{% endblock %}
